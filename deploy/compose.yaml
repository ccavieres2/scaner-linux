# Despliegue de referencia en un host Linux (ADR-0004).
# Uso:  cd deploy && ./make-dev-secrets.sh && docker compose up -d postgres api
#       docker compose run --rm scanner init --file /etc/arsop/scanner.yaml
#       docker compose run --rm scanner scan start --source rrhh --file /etc/arsop/scanner.yaml
# Requisitos de host: mounts SMB/NFS del cliente en /data/input/* con cuenta de SOLO LECTURA.

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256
  ulimits:
    core: 0            # sin core dumps (spec §25)
    nofile: 4096
  restart: unless-stopped

services:
  postgres:
    <<: *hardening
    image: postgres:16-bookworm
    cap_add: [CHOWN, SETUID, SETGID, FOWNER, DAC_OVERRIDE]   # requeridas por initdb/entrypoint
    environment:
      POSTGRES_DB: arsop
      POSTGRES_USER: arsop_scanner
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - pgdata:/var/lib/postgresql/data      # volumen en disco cifrado (LUKS) en producción
    tmpfs:
      - /var/run/postgresql:size=16m,mode=0775
      - /tmp:size=64m,noexec,nosuid
    networks: [backend]                       # sin puertos publicados
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arsop_scanner -d arsop"]
      interval: 10s
      retries: 6

  api:
    <<: *hardening
    build: {context: .., dockerfile: deploy/dockerfiles/api.Dockerfile}
    depends_on: {postgres: {condition: service_healthy}}
    secrets: [db_password, hmac_key, encryption_key, api_principals]
    volumes:
      - ./config/scanner.yaml:/etc/arsop/scanner.yaml:ro
    networks: [backend, frontend]
    ports:
      - "127.0.0.1:8080:8080"                 # solo loopback del host; reverse proxy TLS delante
    mem_limit: 512m
    cpus: 1.0

  scanner:
    <<: *hardening
    restart: "no"
    profiles: [tools]                          # se ejecuta con `docker compose run`
    build: {context: .., dockerfile: deploy/dockerfiles/scanner.Dockerfile}
    depends_on: {postgres: {condition: service_healthy}}
    secrets: [db_password, hmac_key, encryption_key]
    volumes:
      - ./config/scanner.yaml:/etc/arsop/scanner.yaml:ro
      - /data/input/rrhh:/data/input/rrhh:ro          # fuentes SIEMPRE en solo lectura
      - /data/input/finanzas:/data/input/finanzas:ro
      - scannertmp:/var/tmp/arsop                     # temporales del worker (scanner.temp_dir); disco cifrado
    tmpfs:
      - /tmp:size=256m,noexec,nosuid
    networks: [backend]                        # red interna: sin salida a Internet
    mem_limit: 4g        # debe ser > scanner.memory_budget_mb (3072 por defecto) + margen del proceso Go
    cpus: 4.0

networks:
  backend:
    internal: true
  frontend: {}

volumes:
  pgdata: {}
  scannertmp: {}

# Los archivos de ./secrets deben tener permisos 0600 y pertenecer al operador.
secrets:
  db_password: {file: ./secrets/db_password}
  hmac_key: {file: ./secrets/hmac_key}
  encryption_key: {file: ./secrets/encryption_key}
  api_principals: {file: ./secrets/api_principals.yaml}
